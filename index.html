<!DOCTYPE html>

<html lang="pt-br">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Login | Sistema</title>

    <link rel="stylesheet" href="style.css">

    <link

    rel="stylesheet"

    href="https: // cdn.jselivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css">

</head>

<body>

    <main class="login-container">

        <section class="login-card">

            <div class="text-center mb-4">

                <div class="login-incon" aria-hidden="true">🔒</div>

                <h1 class="h3 fw-bold mt-3">Bem vindo!</h1>

                <p class="text-secondary">

                    Entre com seus dados para continuar.

                </p>

            </div>

            <from id="loginForm">

                <div class="mb-3">

                    <label for="login" class="form-label">Login</label>

                    <input

                        type="text"

                        name="login"

                        id="login"

                        class="form-control"

                        placeholder="Digite seu login..."

                        required

                    >

                </div>

 

                <div class="mb-3">

                    <label for="senha" class="form-label">senha</label>

                    <input

                        type="password"

                        name="senha"

                        id="senha"

                        class="form-control"

                        placeholder="Digite seu senha..."

                        required

                    >

                    <div id="messagem" class="alerta d-nome" role="alert" aria-live="polite"></div>

 

                    <button type="submit" id="btnlogin" class="btn btn-primary w-100 py-2">

                        Entrar

                    </button>

            </from>

 

            <p class="text-center text-secondary small mt-4 mb-0">

                Sistema de autenticação com JWT

            </p>

        </section>

    </main>

</body>

</html>
